services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paypilot
      POSTGRES_PASSWORD: paypilot
      POSTGRES_DB: paypilot
    ports:
      - "5433:5432"
    volumes:
      - paypilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  paypilot_pgdata:
